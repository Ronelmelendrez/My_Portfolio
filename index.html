<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set data-theme before first paint so the page never flashes the
      // wrong theme. ThemeProvider reads/writes this same key.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* First-paint boot splash: lives inside #root and is replaced by
         React's first render. Pure CSS so it shows before any JS runs. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0f172a;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      html[data-theme='light'] .boot-splash {
        background: #f8fafc;
      }
      .boot-brand {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      html[data-theme='light'] .boot-brand {
        color: #0f172a;
      }
      .boot-brand .b-l,
      .boot-brand .b-r {
        color: #3b82f6;
      }
      .boot-bar {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3b82f6, #06b6d4);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0F172A" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ronel Melendrez" />
    <meta property="og:title" content="Ronel Melendrez — Full-Stack Developer" />
    <meta property="og:description" content="Full-stack developer building fast, reliable web systems from database schema to pixel. See skills, certificates, projects, and services." />
    <meta property="og:url" content="https://ronelmelendrez.vercel.app/" />
    <meta property="og:image" content="https://ronelmelendrez.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ronel Melendrez — Building software that ships without drama." />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ronel Melendrez — Full-Stack Developer" />
    <meta name="twitter:description" content="Full-stack developer building fast, reliable web systems from database schema to pixel." />
    <meta name="twitter:image" content="https://ronelmelendrez.vercel.app/og-image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio of Ronel, a full stack developer building scalable web systems." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Ronel Melendrez — Portfolio</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Loading">
        <div class="boot-brand"><span class="b-l">&lt;</span>Ronel<span class="b-r">/&gt;</span></div>
        <div class="boot-bar"><i></i></div>
      </div>
      <noscript>
        <style>
          .boot-splash { display: none; }
          .boot-nojs {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: ui-monospace, monospace;
            text-align: center;
            padding: 24px;
          }
        </style>
        <div class="boot-nojs">This site requires JavaScript. Please enable it to continue.</div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
